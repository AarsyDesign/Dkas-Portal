    <script>
      window.addEventListener("DOMContentLoaded", function () {
        try {
          if ("serviceWorker" in navigator && !localStorage.getItem("dkas_sw_v23_cleaned")) {
            localStorage.setItem("dkas_sw_v23_cleaned", "1");
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              var hadOld = false;
              Promise.all(regs.map(function (r) {
                if (r.active && r.active.scriptURL && r.active.scriptURL.endsWith("/sw.js")) {
                  hadOld = true;
                  return r.unregister();
                }
                return Promise.resolve();
              })).then(function () {
                if (hadOld && window.caches) {
                  caches.keys().then(function (keys) {
                    Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                      window.location.reload();
                    });
                  });
                }
              });
            });
          }
        } catch (e) {}
        if (window.PushNotif) {
          window.PushNotif.init({
            appId: "app_ca77d86d",
            apiBase: "https://pushnotif.biz.id",
